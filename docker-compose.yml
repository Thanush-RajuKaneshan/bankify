# Runs the whole system: docker compose up --build
# Only the API gateway (8080) and the Eureka dashboard (8761) are published to the host;
# the services are reachable only through the gateway, which checks the JWT.

x-service-env: &service-env
  DB_USER: postgres
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  EUREKA_URL: http://eureka-server:8761/eureka
  KAFKA_SERVERS: kafka:9092

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/create-databases.sql:/docker-entrypoint-initdb.d/create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30

  eureka-server:
    build: ./eureka-server
    ports:
      - "127.0.0.1:8761:8761"

  user-service:
    build: ./user-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/userservice_db
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars-min}
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eureka-server: { condition: service_started }

  account-service:
    build: ./account-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/accountservice_db
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      eureka-server: { condition: service_started }

  transaction-service:
    build: ./transaction-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/transactionservice_db
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_started }

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32-chars-min}
    depends_on:
      eureka-server: { condition: service_started }

volumes:
  postgres-data:
