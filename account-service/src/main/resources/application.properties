spring.application.name=accountservice
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accountservice_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Kafka: consumes user-events to keep a local copy of registered users (account owners).
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=account-service
spring.kafka.consumer.auto-offset-reset=earliest

server.error.include-message=always
