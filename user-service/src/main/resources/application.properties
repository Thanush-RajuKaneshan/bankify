spring.application.name=userservice
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/userservice_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# Kafka: user events are published as JSON without Java type headers, so any service can read them.
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Do not hold up sign-up or login for the default 60s when Kafka is down.
spring.kafka.producer.properties.max.block.ms=2000

# Shared with the API gateway. Override JWT_SECRET (32+ characters) outside local development.
bankify.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-32-chars-min}
bankify.jwt.ttl-minutes=60

server.error.include-message=always
